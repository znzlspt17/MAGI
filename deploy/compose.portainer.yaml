name: magi

# 최소 이미지에도 KST 시간대 데이터를 제공한다. Pi의 시스템 시간대는 변경하지 않는다.
x-timezone-volume: &timezone-volume
  type: bind
  source: /usr/share/zoneinfo/Asia/Seoul
  target: /usr/share/zoneinfo/Asia/Seoul
  read_only: true
  bind:
    create_host_path: false

x-app: &app
  platform: linux/arm64
  pull_policy: missing
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  stop_grace_period: 600s
  pids_limit: 256
  mem_swappiness: 0
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=1770
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *app
    # 공식 이미지 실행 파일의 file capability와 cap_drop: ALL의 충돌을 피한다.
    cap_add: [NET_BIND_SERVICE]
    image: ${MAGI_CADDY_IMAGE:?릴리스의 Caddy 이미지 태그를 입력하세요}
    environment:
      TZ: Asia/Seoul
      MAGI_PUBLIC_ORIGIN: ${MAGI_PUBLIC_ORIGIN:?HTTPS origin을 입력하세요}
    ports:
      # OMV의 기존 웹 포트를 유지한다. 공유기 외부 80/443을 이 호스트 포트로 전달한다.
      - "${MAGI_HTTP_PORT:-8080}:8080"
      - "${MAGI_HTTPS_PORT:-443}:443"
    networks: [magi-db]
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - *timezone-volume
      - type: bind
        source: ${MAGI_DEPLOY_ROOT:?Pi의 절대 배포 경로를 입력하세요}/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MAGI_DEPLOY_ROOT}/caddy-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MAGI_DEPLOY_ROOT}/caddy-config
        target: /config
        bind:
          create_host_path: false

  backend:
    <<: *app
    image: ${MAGI_BACKEND_IMAGE:?릴리스의 backend 이미지 태그를 입력하세요}
    network_mode: service:caddy
    depends_on:
      caddy:
        condition: service_started
        # Compose가 Caddy를 갱신·재시작하면 공유 네트워크에 다시 합류한다.
        # Docker 자동 재시작이나 Portainer의 개별 Restart에는 전파되지 않는다.
        restart: true
    mem_limit: 3584m
    memswap_limit: 3584m
    environment:
      TZ: Asia/Seoul
      MAGI_PUBLIC_MODE: "1"
      MAGI_LOCAL_LOGIN: "0"
      MAGI_PUBLIC_ORIGIN: ${MAGI_PUBLIC_ORIGIN}
      MAGI_INTERNAL_KEY: ${MAGI_INTERNAL_KEY:?운영 환경에 내부 인증 키를 주입하세요}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?운영 환경에 API 키를 주입하세요}
      GOOGLE_OAUTH_ID: ${GOOGLE_OAUTH_ID:?운영 환경에 OAuth ID를 주입하세요}
      GOOGLE_OAUTH_SECRET: ${GOOGLE_OAUTH_SECRET:?운영 환경에 OAuth secret을 주입하세요}
      MAGI_SUBJECT_PEPPER: ${MAGI_SUBJECT_PEPPER:?기존 계정 식별 설정을 유지하세요}
      MAGI_DB_HOST: magi-postgres
      MAGI_DB_PORT: "5432"
      MAGI_DB_NAME: ${MAGI_DB_NAME:?MAGI 전용 DB 이름을 입력하세요}
      MAGI_DB_USER: ${MAGI_DB_USER:?MAGI 일반 서비스 계정을 입력하세요}
      MAGI_DB_PASSWORD: ${MAGI_DB_PASSWORD:?운영 환경에 DB 비밀번호를 주입하세요}
      MAGI_DB_SSLMODE: ${MAGI_DB_SSLMODE:-disable}
      MAGI_DATA_DIR: /data
      MAGI_EMBEDDING_MODEL_PATH: /models/bge-m3
      MAGI_EMBEDDING_DEVICE: cpu
    volumes:
      - *timezone-volume
      - type: bind
        source: ${MAGI_DEPLOY_ROOT}/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${MAGI_MODEL_ROOT:?준비된 BGE-M3 모델의 Pi 절대 경로를 입력하세요}
        target: /models/bge-m3
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -m, protocol.deployment, backend]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  gateway:
    <<: *app
    image: ${MAGI_GATEWAY_IMAGE:?릴리스의 gateway 이미지 태그를 입력하세요}
    network_mode: service:caddy
    depends_on:
      caddy:
        condition: service_started
        restart: true
      backend:
        condition: service_healthy
        restart: true
    mem_limit: 384m
    memswap_limit: 384m
    volumes:
      - *timezone-volume
    environment:
      TZ: Asia/Seoul
      MAGI_PUBLIC_MODE: "1"
      MAGI_LOCAL_LOGIN: "0"
      MAGI_PUBLIC_ORIGIN: ${MAGI_PUBLIC_ORIGIN}
      MAGI_PROXY_HOPS: "1"
      MAGI_SERVER_URL: ws://127.0.0.1:8765
      MAGI_INTERNAL_KEY: ${MAGI_INTERNAL_KEY}
    healthcheck:
      test: [CMD, python, -m, protocol.deployment, gateway]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 30s

networks:
  magi-db:
    external: true
    name: magi-db
