name: magi-logs

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    platform: linux/arm64
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    stop_signal: SIGINT
    stop_grace_period: 60s
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
      - -memory.allowedBytes=128MiB
      - -search.maxConcurrentRequests=2
      - -search.maxQueryDuration=5s
      - -search.maxQueryTimeRange=7d
    volumes:
      - type: bind
        source: ${LOG_DATA_ROOT:?소유자 10001로 준비한 로그 전용 절대 경로를 입력하세요}/storage
        target: /storage
        bind:
          create_host_path: false
    networks: [logs]
    logging: &rotation
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  vector:
    image: timberio/vector:0.56.0-debian@sha256:93b072b416fd29152f1bfe5bd2925a0b48999aeb069f3ae000691f82a135c200
    platform: linux/arm64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    stop_grace_period: 60s
    command: [--config, /etc/vector/vector.yaml]
    environment:
      MAGI_POSTGRES_CONTAINER: ${MAGI_POSTGRES_CONTAINER:?기존 PostgreSQL 컨테이너의 정확한 이름을 입력하세요}
    volumes:
      # ro 마운트는 Docker API의 쓰기 권한을 제한하지 않는다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${LOG_CONFIG_ROOT:?vector.yaml이 있는 절대 경로를 입력하세요}/vector.yaml
        target: /etc/vector/vector.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOG_DATA_ROOT}/buffer
        target: /var/lib/vector
        bind:
          create_host_path: false
    networks: [logs]
    logging: *rotation

networks:
  logs:
    name: magi-logs
    internal: true
