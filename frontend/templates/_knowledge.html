    <details class="knowledge-panel" id="knowledge-panel" hidden>
     <summary class="graph-screen-title">결정과 명세 지식 그래프</summary>
     <header class="graph-topbar">
      <form id="knowledge-form"><select id="knowledge-session" aria-label="대화 세션"><option value="">전체 세션</option></select><input id="knowledge-query" aria-label="검색" placeholder="지식 검색…"/><button type="submit">검색</button></form>
      <div class="graph-view-switch"><button id="graph-summary" type="button" aria-pressed="true">요약</button><button id="graph-detail-mode" type="button" aria-pressed="false">상세</button></div>
      <button id="graph-list-toggle" type="button">목록</button><button id="graph-fit" type="button">전체 맞춤</button>
      <details class="graph-menu"><summary>필터</summary><div><label>유형<select id="knowledge-kind"><option value="">전체 유형</option><option value="decision">결정</option><option value="requirement">요구사항</option><option value="spec">명세</option><option value="input">사용자 입력</option><option value="review">검토</option></select></label><label>상태<select id="knowledge-status"><option value="">현재 항목</option><option value="confirmed">사용자 확정</option><option value="proposed">LLM 제안</option><option value="assumption">가정</option><option value="superseded">대체된 항목</option></select></label></div></details>
      <details class="graph-menu"><summary>설정</summary><div><label>노드 간격<input id="graph-spacing" type="range" min="15" max="70" value="26"/></label><label>연결 길이<input id="graph-distance" type="range" min="50" max="200" value="95"/></label><label>라벨 양<input id="graph-label-amount" type="range" min="0" max="20" value="8"/></label><label><input id="graph-pause" type="checkbox"/>배치 일시정지</label><button id="graph-layout" type="button">전체 재배치</button></div></details>
      <details class="graph-menu"><summary>관리</summary><div><button id="knowledge-retry" type="button">임베딩 재시도</button></div></details>
     </header>
     <div class="graph-workspace">
      <div id="knowledge-graph" tabindex="0" role="region" aria-label="지식 관계도. 항목 목록으로도 탐색할 수 있습니다."></div><div id="graph-labels" aria-hidden="true"></div>
      <div class="graph-status"><button id="graph-back" type="button" hidden>← 전체 요약</button><p id="knowledge-notice" role="status" aria-live="polite"></p><button id="graph-orphans" type="button" hidden></button></div>
      <p id="graph-empty" hidden>아직 저장된 지식이 없습니다.</p>
      <aside id="knowledge-list" class="graph-drawer graph-results" hidden aria-label="지식 항목 · 검색 결과"><header><strong>지식 항목 · 검색 결과</strong><button id="graph-list-close" type="button" aria-label="목록 닫기">×</button></header><ul id="knowledge-nodes" aria-label="지식 항목 목록"></ul></aside>
      <aside id="graph-inspector" class="graph-drawer graph-inspector" hidden aria-label="선택한 지식 항목"><header><strong>선택 항목</strong><button id="graph-detail-close" type="button" aria-label="상세 닫기">×</button></header><div id="knowledge-detail"></div></aside>
      <footer class="graph-bottom"><div id="graph-legend" class="graph-legend" aria-label="항목 유형"></div><p id="graph-relation" role="status">끌어서 이동 · 휠로 확대 · Esc 선택 해제</p><div id="graph-tools"><button id="graph-zoom-in" type="button" aria-label="그래프 확대">＋</button><button id="graph-zoom-out" type="button" aria-label="그래프 축소">−</button></div></footer>
     </div>
