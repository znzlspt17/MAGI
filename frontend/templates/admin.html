<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MAGI 관리자</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body class="admin-page" data-surface="knowledge"><main>
<header class="admin-heading"><div><a class="brand" href="/">MAGI</a><h1>서비스 관리</h1></div><a href="/">작업 공간으로 돌아가기</a></header>
{% if login_required %}
<p>관리자 계정으로 로그인하세요.</p><a href="/auth/google/start">Google로 로그인</a>
{% else %}
<details class="admin-account"><summary>관리자 계정</summary><p id="account-identity"></p><button id="account-copy" type="button">사용자 ID 복사</button></details>
<nav class="admin-nav" aria-label="관리자 메뉴"><a href="/admin/overview">운영 현황</a><a href="/admin/users">사용자</a><a href="/admin/data">작업·데이터</a><a href="/admin/knowledge">지식 그래프</a><a href="/admin/costs">비용·한도</a></nav>
<p id="admin-error" role="alert"></p>
<section id="public-admin" aria-label="서비스 운영"></section>
<section data-admin-section="data" aria-labelledby="job-title"><h2 id="job-title">작업 조회</h2>
<form id="job-form"><label>작업 ID<input id="job-id" required></label><button>조회</button></form>
<div id="job-result" tabindex="0" aria-label="작업 상세"></div></section>
<section data-admin-section="data" aria-labelledby="cleanup-title"><h2 id="cleanup-title">데이터 삭제 및 복구 정리</h2>
<div class="data-toolbar"><label>작업 검색<input id="cleanup-query" type="search"></label><label>상태<select id="cleanup-status"><option value="">전체 상태</option><option value="FINALIZED">최종 완료</option><option value="error">오류</option><option value="NEEDS_USER_INPUT">확인 필요</option></select></label><label><input id="cleanup-select-all" type="checkbox">현재 목록 전체 선택</label></div>
<button id="cleanup-refresh">목록 새로고침</button><div id="cleanup-list"></div>
<button id="cleanup-selected">선택 작업 삭제 미리보기</button><button id="cleanup-all">전체 기록 삭제 미리보기</button>
<div id="cleanup-pending"></div><p id="cleanup-notice" role="status"></p></section>
<dialog id="cleanup-dialog"><h2>영구 삭제 확인</h2><pre id="cleanup-summary"></pre>
<label id="cleanup-confirm-label">계속하려면 “전체 기록 삭제”를 입력하세요.<input id="cleanup-confirm" autocomplete="off"></label>
<p id="cleanup-error" role="alert"></p><button id="cleanup-cancel">취소</button><button id="cleanup-execute">영구 삭제</button></dialog>
<section data-admin-section="knowledge" class="admin-knowledge"><h2>프로젝트 지식 그래프</h2><label>프로젝트<select id="admin-project"><option value="">프로젝트 선택</option></select></label><p id="project-notice" role="status"></p>{% include '_knowledge.html' %}</section>
<script src="{{ url_for('static', filename='admin.js') }}"></script><script src="{{ url_for('static', filename='vendor/cytoscape-3.33.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/d3-dispatch-3.0.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/d3-quadtree-3.0.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/d3-timer-3.0.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/d3-force-3.0.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='knowledge-data.js') }}"></script>
<script src="{{ url_for('static', filename='knowledge-layout.js') }}"></script>
<script src="{{ url_for('static', filename='knowledge-labels.js') }}"></script>
<script src="{{ url_for('static', filename='knowledge-graph.js') }}"></script>
<script src="{{ url_for('static', filename='knowledge.js') }}"></script>
{% endif %}
</main></body></html>
