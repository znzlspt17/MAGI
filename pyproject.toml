[tool.uv]
package = false
# CVE-2026-63374: 전이 의존성이 취약한 AnyIO로 되돌아가지 않게 한다.
# GHSA-6q48-6c7w-9gw2: 신뢰 인증서 목록의 취약 버전 재설치를 막는다.
constraint-dependencies = ["anyio>=4.14.2,<5", "certifi>=2026.10.19"]

[project]
name = "magi"
version = "0.3.1"
description = "MAGI generates reviewed AI-agent-ready implementation specifications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.0",
  "Flask-Sock>=0.7.0",
  "openai>=3.31.0",
  "pydantic>=2.0,<3",
  "langgraph>=1.0.0",
  "pyyaml>=6.0.0",
  "websockets>=15,<17",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "Authlib>=1.6,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=5.1,<6", "torch>=2,<3"]
test = ["pytest>=8,<10"]
production = ["gunicorn>=23,<24; sys_platform != 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "gateway*", "protocol*", "frontend*"]

[tool.setuptools.package-data]
"backend" = ["prompts/*.md"]
"backend.knowledge" = ["migrations/*.sql"]
"frontend" = ["templates/*.html", "static/dist/manifest.json", "static/dist/assets/*", "static/vendor/*.txt", "static/vendor/*.json"]
