name: Build Raspberry Pi release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magi-arm64-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/verify.yml
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/prepare-arm64.yml
  publish:
    needs: [verify, prepare]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.22.0
          driver-opts: image=moby/buildkit:v0.20.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: output
      - name: Load and validate checked images
        run: |
          docker load -i output/images.tar
          docker pull --platform linux/arm64 rabbitmq:4@sha256:485319d42170eab53d8a030e1cc49d95e41f5d325479fa504736db8091981eb7
          python -c 'import os; from pathlib import Path; from deploy.artifacts import verify_release; verify_release(Path("output/release"), os.environ["GITHUB_SHA"])'
      - name: Restore release ID
        run: echo "RELEASE_ID=$(python -c 'import json; print(json.load(open("output/release/release.json"))["release"])')" >> "$GITHUB_ENV"
      # 모든 smoke·취약점 검사가 성공한 뒤에만 게시 권한으로 로그인한다.
      - name: Authenticate to GHCR after successful release checks
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images and verify registry identities
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from deploy.artifacts import publish
          publish(Path("output/release"), os.environ["GITHUB_REPOSITORY"], Path("output/portainer-images.txt"))
          PY
      - name: Show image variables for Portainer
        run: |
          {
            echo '### Portainer image variables'
            echo 'Stack 이미지 변수는 아래 latest 주소로 한 번 설정하세요. 이후 Stack 전체를 Re-pull image and redeploy로 갱신하세요.'
            echo '```dotenv'
            cat output/portainer-images.txt
            echo '```'
            echo '### Release identities (rollback)'
            python -c "import json; m=json.load(open('output/release/release.json')); print('Release: ' + m['release']); [print(r + ': ' + i['tag'] + ' (' + i['reference'] + ')') for r,i in m['published'].items()]"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete previous GHCR image versions after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from deploy.cleanup_images import cleanup
          manifest = json.loads(Path('output/release/release.json').read_text(encoding='utf-8'))
          cleanup(os.environ['GITHUB_REPOSITORY'], os.environ['REPOSITORY_OWNER_TYPE'], manifest)
          PY
      - name: Preserve image identities and scan diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magi-image-reports-${{ env.RELEASE_ID }}
          path: |
            output/release/*.vulnerabilities.json
            output/release/release.json
            output/portainer-images.txt
          retention-days: 14
          if-no-files-found: error
