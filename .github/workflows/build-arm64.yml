name: Build Raspberry Pi release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magi-arm64-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v9.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.22.0
          driver-opts: image=moby/buildkit:v0.20.2
      - name: Build ARM64 gateway with cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/arm64
          target: gateway
          tags: magi-gateway:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,version=2,scope=magi-gateway-arm64
          cache-to: type=gha,version=2,scope=magi-gateway-arm64,mode=max
      - name: Build ARM64 backend with cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/arm64
          target: backend
          tags: magi-backend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,version=2,scope=magi-backend-arm64
          cache-to: type=gha,version=2,scope=magi-backend-arm64,mode=max
      - name: Smoke-check local ARM64 images
        id: images
        run: python deploy/release.py smoke --output output/release --release "$RELEASE_ID"
      - name: Scan backend fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-backend:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/backend.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan gateway fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-gateway:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/gateway.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Caddy fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-caddy:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/caddy.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Show vulnerability IDs and fixed versions even on failure
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: python deploy/release.py summarize-scans --output output/release
      # 모든 smoke·취약점 검사가 성공한 뒤에만 게시 권한으로 로그인한다.
      - name: Authenticate to GHCR after successful release checks
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images and verify registry identities
        run: python deploy/release.py publish --output output/release --repository "$GITHUB_REPOSITORY" --images-file output/portainer-images.txt
      - name: Show image variables for Portainer
        run: |
          {
            echo '### Portainer image variables'
            echo 'Stack 이미지 변수는 아래 latest 주소로 한 번 설정하세요. 이후 Stack 전체를 Re-pull image and redeploy로 갱신하세요.'
            echo '```dotenv'
            cat output/portainer-images.txt
            echo '```'
            echo '### Release identities (rollback)'
            python -c "import json; m=json.load(open('output/release/release.json')); print('Release: ' + m['release']); [print(r + ': ' + i['tag'] + ' (' + i['reference'] + ')') for r,i in m['published'].items()]"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve image identities and scan diagnostics
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magi-image-reports-${{ env.RELEASE_ID }}
          path: |
            output/release/*.vulnerabilities.json
            output/release/release.json
            output/portainer-images.txt
          retention-days: 14
          if-no-files-found: error
