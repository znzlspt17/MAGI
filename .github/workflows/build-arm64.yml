name: Build Raspberry Pi release

on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: "개발 BGE-M3의 40자리 commit SHA와 일치하는지 확인하세요"
        required: true
        default: "5617a9f61b028005a4858fdac845db406aefb181"
        type: string

permissions:
  contents: read

concurrency:
  group: magi-arm64-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL_REVISION: ${{ inputs.model_revision }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v9.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.22.0
          driver-opts: image=moby/buildkit:v0.20.2
      - name: Build, smoke-check and export local ARM64 images
        run: python deploy/release.py build --output output/release --release "$RELEASE_ID" --model-revision "$MODEL_REVISION"
      - name: Backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: magi-backend:${{ env.RELEASE_ID }}
          syft-version: v1.55.0
          format: spdx-json
          output-file: output/release/backend.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Gateway SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: magi-gateway:${{ env.RELEASE_ID }}
          syft-version: v1.55.0
          format: spdx-json
          output-file: output/release/gateway.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Caddy SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: magi-caddy:${{ env.RELEASE_ID }}
          syft-version: v1.55.0
          format: spdx-json
          output-file: output/release/caddy.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan backend fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-backend:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/backend.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan gateway fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-gateway:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/gateway.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Caddy fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-caddy:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/caddy.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Finalize checksums only after successful scans
        run: python deploy/release.py finalize --output output/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magi-arm64-${{ env.RELEASE_ID }}
          path: output/release/
          retention-days: 14
          if-no-files-found: error
