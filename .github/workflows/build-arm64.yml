name: Build Raspberry Pi release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magi-arm64-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set readable release ID
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from deploy.version import release_id
          release = release_id(Path('pyproject.toml'), os.environ['GITHUB_RUN_NUMBER'], os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'RELEASE_ID={release}\n')
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v9.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.22.0
          driver-opts: image=moby/buildkit:v0.20.2
      - name: Build ARM64 gateway with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          target: gateway
          tags: magi-gateway:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,version=2,scope=magi-gateway-arm64
          cache-to: type=gha,version=2,scope=magi-gateway-arm64,mode=max
      - name: Build ARM64 backend with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          target: backend
          tags: magi-backend:${{ env.RELEASE_ID }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,version=2,scope=magi-backend-arm64
          cache-to: type=gha,version=2,scope=magi-backend-arm64,mode=max
      - name: Smoke-check local ARM64 images
        id: images
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from deploy.artifacts import smoke
          smoke(Path("output/release"), os.environ["RELEASE_ID"])
          PY
      - name: Scan backend fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-backend:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/backend.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan gateway fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-gateway:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/gateway.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Caddy fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: magi-caddy:${{ env.RELEASE_ID }}
          scanners: vuln
          format: json
          output: output/release/caddy.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan RabbitMQ fixable critical vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.76.0
          image-ref: rabbitmq:4@sha256:485319d42170eab53d8a030e1cc49d95e41f5d325479fa504736db8091981eb7
          scanners: vuln
          format: json
          output: output/release/rabbitmq.vulnerabilities.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Show vulnerability IDs and fixed versions even on failure
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from deploy.artifacts import summarize_scans
          raise SystemExit(0 if summarize_scans(Path("output/release")) else 1)
          PY
      # 모든 smoke·취약점 검사가 성공한 뒤에만 게시 권한으로 로그인한다.
      - name: Authenticate to GHCR after successful release checks
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images and verify registry identities
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from deploy.artifacts import publish
          publish(Path("output/release"), os.environ["GITHUB_REPOSITORY"], Path("output/portainer-images.txt"))
          PY
      - name: Show image variables for Portainer
        run: |
          {
            echo '### Portainer image variables'
            echo 'Stack 이미지 변수는 아래 latest 주소로 한 번 설정하세요. 이후 Stack 전체를 Re-pull image and redeploy로 갱신하세요.'
            echo '```dotenv'
            cat output/portainer-images.txt
            echo '```'
            echo '### Release identities (rollback)'
            python -c "import json; m=json.load(open('output/release/release.json')); print('Release: ' + m['release']); [print(r + ': ' + i['tag'] + ' (' + i['reference'] + ')') for r,i in m['published'].items()]"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete previous GHCR image versions after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from deploy.cleanup_images import cleanup
          manifest = json.loads(Path('output/release/release.json').read_text(encoding='utf-8'))
          cleanup(os.environ['GITHUB_REPOSITORY'], os.environ['REPOSITORY_OWNER_TYPE'], manifest)
          PY
      - name: Preserve image identities and scan diagnostics
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magi-image-reports-${{ env.RELEASE_ID }}
          path: |
            output/release/*.vulnerabilities.json
            output/release/release.json
            output/portainer-images.txt
          retention-days: 14
          if-no-files-found: error
