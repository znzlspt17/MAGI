name: Verify MAGI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      rabbitmq:
        image: rabbitmq:4@sha256:485319d42170eab53d8a030e1cc49d95e41f5d325479fa504736db8091981eb7
        env:
          RABBITMQ_DEFAULT_USER: ci-magi
          RABBITMQ_DEFAULT_PASS: ci-only-rabbit
        ports:
          - 5672:5672
        options: >-
          --memory 512m --memory-swap 512m
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --no-dev --extra test --group gateway
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile
      - name: Python contracts and architecture
        run: |
          uvx --from mypy==1.18.2 mypy --python-executable .venv/bin/python
          .venv/bin/python -m pytest -q tests/core/test_architecture.py
      - name: Frontend tests and production assets
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Install browser for acceptance scenarios
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Product boundary tests with real PostgreSQL and checkpointer
        env:
          CI_POSTGRES: '1'
          CI_RABBITMQ: '1'
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: '5672'
          RABBITMQ_VHOST: '/'
          RABBITMQ_USER: ci-magi
          RABBITMQ_PASSWORD: ci-only-rabbit
          CI_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: .venv/bin/python -m pytest -q
      - name: Check deployment inputs
        run: |
          .venv/bin/python - <<'PY'
          from deploy.artifacts import release_inputs
          release_inputs()
          PY
