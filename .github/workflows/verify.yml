name: Verify MAGI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --no-dev --extra test --group gateway
      - name: Python contracts
        run: uvx --from mypy==1.18.2 mypy --python-executable .venv/bin/python
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --no-dev --extra test --group gateway
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile
      - name: Frontend types and tests
        run: |
          .venv/bin/python resources/licenses/python_notices.py --output frontend/static/vendor/python
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      rabbitmq:
        image: rabbitmq:4@sha256:485319d42170eab53d8a030e1cc49d95e41f5d325479fa504736db8091981eb7
        env:
          RABBITMQ_DEFAULT_USER: ci-magi
          RABBITMQ_DEFAULT_PASS: ci-only-rabbit
        ports:
          - 5672:5672
        options: >-
          --memory 512m --memory-swap 512m
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --no-dev --extra test --group gateway
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile
      - name: Frontend tests and production assets
        run: |
          .venv/bin/python resources/licenses/python_notices.py --output frontend/static/vendor/python
          pnpm --dir frontend exec vite build
      - name: Install browser for acceptance scenarios
        run: |
          # 2026-11-12: Azure 미러 DNS 장애 시 공식 Ubuntu 미러로 패키지를 받는다.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Product boundary tests with real PostgreSQL and checkpointer
        env:
          CI_POSTGRES: '1'
          CI_RABBITMQ: '1'
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: '5672'
          RABBITMQ_VHOST: '/'
          RABBITMQ_USER: ci-magi
          RABBITMQ_PASSWORD: ci-only-rabbit
          CI_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: .venv/bin/python -m pytest -q --durations=30 --junitxml=output/pytest-integration.xml
      - name: Check deployment inputs
        run: |
          .venv/bin/python - <<'PY'
          from deploy.artifacts import release_inputs
          release_inputs()
          PY
      - name: Preserve pytest timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-integration-${{ github.run_attempt }}
          path: output/pytest-integration.xml
          retention-days: 7
          if-no-files-found: ignore
  verify:
    if: ${{ always() }}
    needs: [static, frontend, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job
        env:
          STATIC: ${{ needs.static.result }}
          FRONTEND: ${{ needs.frontend.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: test "$STATIC" = success && test "$FRONTEND" = success && test "$INTEGRATION" = success
