name: Verify MAGI

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.10.0
          uv sync --locked --no-dev
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile
      - name: Frontend tests and production assets
        run: |
          pnpm --dir frontend test
          pnpm --dir frontend build
      # /tests는 로컬 전용이다. 이 검사는 Python 회귀 테스트를 대체하지 않는다.
      - name: Python syntax check (regression tests run locally)
        run: .venv/bin/python -m compileall -q backend gateway protocol deploy frontend/__init__.py
